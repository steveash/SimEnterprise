# Benchmark world: an analytics shop with four deliberate homonyms (P570787448, diversity axis 15).
#
# Same seed and departments as analytics-structured-clean. Four pairs of people in different
# departments share one full name, each labelled homonym_of in the gold KG. A document names
# only the twin of its own department (the document view hides the other), so every gold
# mention edge says which one is meant; a memory system must use the context to tell them apart.
#
# Live-prose variant (Haiku 5.5 via Bedrock, through the call governor); same knobs as the synth example.
#   enterprise-sim world create examples/worlds/diversity-live/analytics-homonyms-live.toml --live
seed = 104

[company]
name = "Corvid Analytics"
vertical = "analytics"
size = "medium"
description = "A marketplace company whose analytics team answers the business's questions."

[simulation]
period_start = 2026-01-05
period_end = 2026-03-27

[model]
backend = "bedrock"
name = "us.anthropic.claude-haiku-5-5"
offline_backend = "synth"

[[departments]]
archetype = "data_analytics"
[[departments]]
archetype = "marketing"
[[departments]]
archetype = "sales"

[facts]
per_project = 8
change_rate = 0.3

[data]
scenarios = ["product_growth", "sales_pipeline", "support_ops", "subscription_finance", "marketing_attribution"]
scale_factor = 0.1  # catalog size (datasets-cc: wave 2 at 0.1); `world data ... --scale 10` for full scale
iterations = 3

[org]
homonyms = 4

[scale]
max_concurrency = 2
cost_ceiling_usd = 5.0
