# Benchmark world: a structure-heavy analytics shop, MESSY data (priority family: data analysis).
#
# Analytics leads, with marketing and sales as its customers. All five data
# scenarios over a quarter (scale 0.1 for the catalog; 10x with --scale 10): the documents (analysis requests and
# reports, metric definitions, experiment readouts) sit on top of large tables
# whose raw rows are dirty (nulls, duplicate loads, label drift, unit slips, a
# renamed column) while the views stay clean. Twin of analytics-structured-clean
# (same seed and org; only [data.messiness] and [messiness] differ).
#
#   enterprise-sim world create examples/worlds/analytics-structured-messy.toml
seed = 104
worlds_root = "worlds"

[company]
name = "Corvid Analytics"
vertical = "analytics"
size = "medium"
description = "A marketplace company whose analytics team answers the business's questions."

[simulation]
period_start = 2026-01-05
period_end = 2026-03-27

[model]
backend = "anthropic_api"
name = "claude-haiku-4-5"
offline_backend = "synth"

[[departments]]
archetype = "data_analytics"
[[departments]]
archetype = "marketing"
[[departments]]
archetype = "sales"

[facts]
per_project = 8
change_rate = 0.3

[data]
scenarios = ["product_growth", "sales_pipeline", "support_ops", "subscription_finance", "marketing_attribution"]
scale_factor = 0.1  # catalog size (the dataset catalog's wave 2 uses 0.1); `world data ... --scale 10` for full scale
iterations = 3

[data.messiness]
null_rate = 0.04
duplicate_rate = 0.03
label_drift_rate = 0.15
outlier_rate = 0.01
schema_drift = true

[messiness]
typo_rate = 0.015
alias_rate = 0.3
date_format_mix = 0.4
duplicate_rate = 0.05
