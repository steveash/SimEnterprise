# Benchmark world (S): a small law-and-advisory firm with three walled client matters
# (decision record 0036).
#
# Legal runs three client matters that look alike on purpose: one topic stem, one
# playbook, the same fact attributes. Each matter has its own staff, and its values
# (versions, budgets, vendors) are its own. No document, chat thread or sensitive
# sentence of one matter names another's staff or states another's decisive value;
# the export declares the walls (export.json "isolation", gold). Finance and people
# operations are company-wide and unwalled. For cross-project privacy scenarios: a
# memory system must keep each client matter's knowledge inside its matter.
#
#   enterprise-sim world create examples/worlds/walled-small-legal.toml
seed = 161
worlds_root = "worlds"

[company]
name = "Ashby & Lowe Counsel"
vertical = "professional services"
size = "small"
description = "A small firm advising regulated clients on contracts and data protection."

[simulation]
period_start = 2026-01-05
period_end = 2026-03-27

[model]
backend = "anthropic_api"
name = "claude-haiku-4-5"
offline_backend = "synth"

[[departments]]
archetype = "legal"
[[departments]]
archetype = "finance"
[[departments]]
archetype = "people_ops"

[isolation]
walled_projects = 3
department = "legal"

[org]
squads_per_team = "2..2"

[facts]
per_project = 7
change_rate = 0.4
stale_rate = 0.15
conflict_rate = 0.05

[chat]
rate = 0.3

[privacy]
sensitive_rate = 0.3
